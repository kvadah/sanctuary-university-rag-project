version: '3.8'

services:
  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgehub-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=knowledgehub
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - qdrant
      - redis
      - minio

  # Next.js Frontend User Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgehub-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # Background Ingestion & Processing Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgehub-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - backend
      - redis
      - postgres

  # PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: knowledgehub-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=knowledgehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Qdrant Vector Search Engine
  qdrant:
    # Must be >=1.10 (and matched to the qdrant-client version in
    # requirements.txt, currently 1.19.x): the client uses the Query API
    # (POST /points/query), which older servers like 1.7.x do not expose and
    # answer with 404 — surfacing as an unhandled 500 on every retrieval.
    image: qdrant/qdrant:v1.19.0
    container_name: knowledgehub-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Redis Cache and Celery Broker
  redis:
    image: redis:7-alpine
    container_name: knowledgehub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: knowledgehub-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
